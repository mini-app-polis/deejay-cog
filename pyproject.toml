[project]
name = "deejay-cog"
dynamic = ["version"]
description = "DJ set CSV processor. Normalizes, validates, and ingests DJ set data into Google Sheets and api-kaianolevine-com."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "miniapppolis-common-utils>=5.5.0,<6",
    "prefect>=3.0,<4.0",
    "python-dotenv",
    "sentry-sdk",
    "music-tag>=0.4.3",
    "pyacoustid>=1.2.2",
    "musicbrainzngs>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "ruff>=0.8.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/deejay_cog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deejay_cog"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "ARG001",
]

[tool.ruff.lint.isort]
known-first-party = ["deejay_cog"]

[tool.ruff.format]
quote-style = "double"
