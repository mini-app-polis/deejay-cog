[project]
name = "deejay-cog"
dynamic = ["version"]
description = "DJ set CSV processor. Normalizes, validates, and ingests DJ set data into Google Sheets and api-kaianolevine-com."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "miniapppolis-common-utils>=6.22.0,<7",
    # Request models are pydantic; ValidationError is caught where a set the
    # API would refuse is counted as a failure rather than sent.
    "pydantic>=2.6,<3.0",
    "pytz",
    "sentry-sdk",
    "music-tag>=0.4.3",
    "pyacoustid>=1.2.2",
    "musicbrainzngs>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "ruff>=0.8.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/deejay_cog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deejay_cog"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
# TEST-019: CI fails below this floor. Raise it as coverage rises; lowering it is a reviewed edit.
fail_under = 82
show_missing = true
skip_empty = true
ignore_errors = true

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "ARG001",
]

[tool.ruff.lint.isort]
known-first-party = ["deejay_cog"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
# The uv minor every lock in the fleet is written with. A range, not an exact
# pin: Dependabot runs its own single uv and refuses to update a repository
# whose pin excludes it, and it follows uv's patch releases. setup-uv reads
# this in CI and installs the newest uv inside the range; a uv outside it
# refuses to run instead of rewriting the lock's revision. Moving to a new
# minor is a fleet sweep: bump this everywhere, then re-lock, in commits of
# their own.
required-version = ">=0.13.0,<0.14"
