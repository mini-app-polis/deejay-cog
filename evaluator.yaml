# deejay-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-0001, ADR-0002

type: pipeline-cog

exemptions:
  - rule: PIPE-005
    reason: >
      Two flagged calls in src/deejay_cog/process_new_files.py, both
      deleting sheets this cog derived, never an upstream input. The
      second, in _roll_back_upload, deletes the Google Sheet the same run
      uploaded from a CSV whose API ingest then failed; the CSV itself is
      kept (renamed FAILED_) and the next run re-creates the sheet from
      it. Without the rollback the retry would see the sheet, flag the CSV
      possible_duplicate_ and never ingest the set. The first, inside
      remove_summary_file_for_year, deletes a *derivative summary
      sheet*, not an upstream input. The summary sheet is created by
      this same cog in generate_summaries.py (via
      g.drive.create_spreadsheet_in_folder) and is regenerated from
      scratch on every generate-summaries run. The deletion runs
      immediately before regeneration to prevent stale duplicates
      from accumulating in the Summary folder. PIPE-005's intent is
      to protect raw inputs (CSVs, transcripts) from accidental
      deletion; that intent does not apply here. The deterministic
      checker's pattern match on delete_file(...) is too broad to
      distinguish derivative artifacts from upstream inputs —
      tracked as a future tightening of the PIPE-005 detector.
  - rule: CD-026
    reason: >
      ci.yml has one job outside the canonical set: `deploy-fingerprint`,
      beside `deploy`. The fingerprint function is a second Lambda built
      from the same package and release, deployed through its own role
      (AWS_FINGERPRINT_DEPLOY_ROLE_ARN) to its own function. It can't go
      in `deploy`, which calls the shared lambda-deploy.yml once, for one
      function, and takes no extra steps. It isn't `test`: it runs after
      the release, on main only, against AWS.
