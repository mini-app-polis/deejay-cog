# deejay-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: pipeline-cog

deferrals:
  # Infrastructure moved out of this repository into mini-app-polis/infra
  # (one Terraform root, one shared cog-worker module). These rules still
  # read a local infra/*.tf that no longer exists; they are to be retargeted
  # at the infra repository and the module. Nothing they check was removed:
  # the queue, dead-letter queue, redrive policy, ReportBatchItemFailures,
  # concurrency ceiling (now a module validation), limits and the DLQ alarm
  # with an action are all declared there.
  - rule: PIPE-016
    reason: "Queue, function and event source mapping are declared in mini-app-polis/infra (cogs.tf, modules/cog-worker), not a local infra/."
    until: null
  - rule: PIPE-017
    reason: "Redrive policy, DLQ and ReportBatchItemFailures are fixed by modules/cog-worker in mini-app-polis/infra for every cog."
    until: null
  - rule: PIPE-018
    reason: "The concurrency ceiling is set in mini-app-polis/infra cogs.tf, and modules/cog-worker refuses a plan that states it zero or two times."
    until: null
  - rule: CD-010
    reason: "The dead-letter-queue alarm and its SNS action are declared by modules/cog-worker in mini-app-polis/infra."
    until: null
  - rule: CD-024
    reason: "Function memory and timeout are set in mini-app-polis/infra cogs.tf."
    until: null

exemptions:
  - rule: PIPE-005
    reason: >
      The flagged call (g.drive.delete_file in
      src/deejay_cog/process_new_files.py inside
      remove_summary_file_for_year) deletes a *derivative summary
      sheet*, not an upstream input. The summary sheet is created by
      this same cog in generate_summaries.py (via
      g.drive.create_spreadsheet_in_folder) and is regenerated from
      scratch on every generate-summaries run. The deletion runs
      immediately before regeneration to prevent stale duplicates
      from accumulating in the Summary folder. PIPE-005's intent is
      to protect raw inputs (CSVs, transcripts) from accidental
      deletion; that intent does not apply here. The deterministic
      checker's pattern match on delete_file(...) is too broad to
      distinguish derivative artifacts from upstream inputs —
      tracked as a future tightening of the PIPE-005 detector.