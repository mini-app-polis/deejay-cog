name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over
  # full history, pip-audit against the resolved dependency set, semgrep,
  # and a CycloneDX SBOM retained as a build artifact. The steps live in
  # mini-app-polis/.github so the pinned tool versions and the gating
  # decisions are in one place; see that repo's README for the inputs.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: python
      package-manager: uv

  # Lock check, lint, format and tests, from the shared workflow so every
  # cog's `test` stage is the same stage. See mini-app-polis/.github.
  test:
    uses: mini-app-polis/.github/.github/workflows/python-test.yml@v3
    with:
      # TEST-012. Without this input the shared workflow skips its
      # typecheck step and says nothing, which is how this repo went
      # untyped.
      typecheck: "uv run mypy src/"

  release:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # VER-006: semantic-release and its plugins from the fleet's shared lockfile.
    uses: mini-app-polis/.github/.github/workflows/release.yml@v3

  # The worker is deployed here, as a job, rather than by a workflow's own
  # trigger: a release published with GITHUB_TOKEN starts no workflows, so
  # `on: release` would never fire and the Lambda would drift behind main.
  deploy:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      id-token: write
      contents: read
    uses: mini-app-polis/.github/.github/workflows/lambda-deploy.yml@v3
    with:
      ref: ${{ needs.release.outputs.tag }}
      # These three match the function declared in mini-app-polis/infra; the deploy refuses a function
      # whose architecture differs.
      handler: deejay_cog.worker.lambda_handler
      architecture: x86_64
      python-version: "3.11"
      role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      region: ${{ vars.AWS_REGION }}
      function-name: ${{ vars.AWS_FUNCTION_NAME }}

  # The fingerprint function: a second function from the same package and
  # release, deployed through its own role. Its handler and architecture
  # match the function declared in mini-app-polis/infra.
  deploy-fingerprint:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      id-token: write
      contents: read
    uses: mini-app-polis/.github/.github/workflows/lambda-deploy.yml@v3
    with:
      ref: ${{ needs.release.outputs.tag }}
      handler: deejay_cog.fingerprint.lambda_handler
      architecture: x86_64
      python-version: "3.11"
      role-arn: ${{ vars.AWS_FINGERPRINT_DEPLOY_ROLE_ARN }}
      region: ${{ vars.AWS_REGION }}
      function-name: ${{ vars.AWS_FINGERPRINT_FUNCTION_NAME }}

  # Conformance is graded on each release, after that release is running.
  # Sequential with deploy, as in every Lambda cog: a release that did not
  # deploy is not graded as though it had, and a push that cut no release
  # has nothing new to grade. The evaluation runs after this job ends, so
  # what the job reports is whether the request landed — never what was
  # found.
  evaluate:
    needs: deploy
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
